/* =========================

========================= */

async function compressImageFile(file, maxDim = 400) {

  const bitmap = await createImageBitmap(file);

  let w = bitmap.width;

  let h = bitmap.height;


  if (w > maxDim || h > maxDim) {

    if (w > h) {

      h = Math.round(
        (h * maxDim) / w
      );

      w = maxDim;

    } else {

      w = Math.round(
        (w * maxDim) / h
      );

      h = maxDim;

    }

  }


  const canvas = document.createElement("canvas");

  canvas.width = w;

  canvas.height = h;


  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    bitmap,
    0,
    0,
    w,
    h
  );


  return new Promise(resolve => {

    canvas.toBlob(
      resolve,
      "image/jpeg",
      0.8
    );

  });

}

function initStoreConfigListener() {

  console.log(
    "⚙️ Conectando con configuración..."
  );


  onSnapshot(

    doc(
      db,
      "configuracion",
      "general"
    ),

    (docSnap) => {

      console.log(
        "⚙️ Configuración recibida:",
        docSnap.exists()
      );


      if (docSnap.exists()) {

        storeConfig = {

          ...storeConfig,

          ...docSnap.data()

        };


        document
          .getElementById("store-name")
          .textContent =
            storeConfig.name ||
            "Plan Frozen";


        if (storeConfig.logoUrl) {

          document
            .getElementById("store-logo")
            .src =
              storeConfig.logoUrl;

        }

      }

    },


    (error) => {

      console.error(
        "❌ ERROR CONFIGURACIÓN:",
        error
      );

    }

  );

}



/* =========================
   PRODUCTOS FIRESTORE
========================= */

function initProductsListener() {

  console.log(
    "📡 Conectando con Firestore..."
  );


  const container =
    document.getElementById(
      "products-container"
    );


  container.innerHTML = `
    <div class="status-message status-loading">
      ⏳ Cargando productos...
    </div>
  `;


  const prodsRef =
    collection(
      db,
      "productos"
    );


  onSnapshot(

    prodsRef,


    (snapshot) => {

      console.log(
        "📦 PRODUCTOS ENCONTRADOS:",
        snapshot.size
      );


      const newProducts = [];


      snapshot.forEach((docSnap) => {

        console.log(
          "Producto recibido:",
          docSnap.id,
          docSnap.data()
        );


        newProducts.push({

          id: docSnap.id,

          ...docSnap.data()

        });

      });


      products = newProducts;


      renderProducts();

    },


    (error) => {

      console.error(
        "❌ ERROR FIRESTORE PRODUCTOS:",
        error
      );


      /*
      Si ya había productos cargados,
      no borramos la vista.
      */

      if (products.length > 0) {

        console.warn(
          "Se conserva la última lista de productos."
        );

        return;

      }


      container.innerHTML = `

        <div class="status-message status-error">

}

    )

      btn => {

        btn.addEventListener(
          "click",

          e =>
            addToCart(
              e.target.dataset.add
            )
        );

      }
    );



  document
    .querySelectorAll(
      ".btn-edit"
    )
    .forEach(

      btn => {

        btn.addEventListener(

          "click",

          e =>
            editProduct(
              e.target.dataset.id
            )

        );

      }
    );



  document
    .querySelectorAll(
      ".btn-danger"
    )
    .forEach(

      btn => {

        if (
          btn.dataset.id
        ) {

          btn.addEventListener(

            "click",

            e =>
              deleteProduct(
                e.target.dataset.id
              )

          );

        }

      }
    );

}



/* =========================
   CARRITO
========================= */

function addToCart(productId) {

  const itemInCart =
    cart.find(
      item =>
        item.id ===
        productId
    );


  if (
    itemInCart
  ) {

    itemInCart.quantity++;

  } else {

    const product =
      products.find(
        p =>
          p.id ===
          productId
      );


    if (
      product
    ) {

      cart.push({

        ...product,

        quantity: 1

      });

    }

  }


  updateCartUI();

}



function updateCartUI() {

  const cartContainer =
    document.getElementById(
      "cart-items"
    );


  const totalContainer =
    document.getElementById(
      "cart-total"
    );


  if (
    cart.length === 0
  ) {

    cartContainer.innerHTML =
      "<p>El carrito está vacío.</p>";


    totalContainer.textContent =
      "Total: $0";


    return;

  }


  cartContainer.innerHTML =
    "";


  let total = 0;


  cart.forEach(
    item => {

      const subtotal =
        Number(item.price) *
        item.quantity;


      total += subtotal;


      cartContainer.innerHTML += `

        <div
          style="
            display:flex;
            justify-content:space-between;
            margin-bottom:8px;
          "
        >

          <div>

            <strong>
              ${item.name}
            </strong>

            <br>

            <small>

              $${item.price}

              x

              ${item.quantity}

            </small>

          </div>


          <div>

            $${subtotal.toLocaleString("es-AR")}

          </div>

        </div>

      `;

    }
  );


  totalContainer.textContent =
    "Total: $" +
    total.toLocaleString(
      "es-AR"
    );

}

/* =========================
   GUARDAR PRODUCTO
========================= */

document
  .getElementById(
    "product-form"
  )
  .addEventListener(

    "submit",

    async e => {

      e.preventDefault();


      if (
        !currentUser
      ) {

        return alert(
          "Debés iniciar sesión."
        );

      }


      const submitBtn =
        document.getElementById(
          "prod-submit-btn"
        );


      const id =
        document
          .getElementById(
            "prod-id"
          )
          .value ||
        Date.now()
          .toString();


      const name =
        document
          .getElementById(
            "prod-name"
          )
          .value
          .trim();


      const price =
        parseFloat(
          document
            .getElementById(
              "prod-price"
            )
            .value
        );


      const urlInput =
        document
          .getElementById(
            "prod-image"
          )
          .value
          .trim();


      const fileInput =
        document.getElementById(
          "prod-image-file"
        );


      if (
        !name ||
        isNaN(price)
      ) {

        return alert(
          "Completá nombre y precio."
        );

      }


      submitBtn.disabled =
        true;


      submitBtn.textContent =
        "⏳ Guardando...";


      try {

        const existingProduct =
          products.find(
            p =>
              p.id === id
          );


        let finalImageUrl =
          urlInput ||
          (
            existingProduct
              ? existingProduct.image
              : "https://via.placeholder.com/150"
          );


        if (
          fileInput.files.length > 0
        ) {

          const file =
            fileInput.files[0];


          console.log(
            "📤 Subiendo imagen..."
          );


          const compressedBlob =
            await compressImageFile(
              file,
              400
            );


          const storageRef =
            ref(

              storage,

              "productos/prod_" +
              Date.now() +
              ".jpg"

            );


          const snapshot =
            await uploadBytes(
              storageRef,
              compressedBlob
            );


          finalImageUrl =
            await getDownloadURL(
              snapshot.ref
            );

        }


        const productData = {

          name,

          price,

          image:
            finalImageUrl,

          updatedAt:
            new Date()
              .toISOString()

        };


        console.log(
          "💾 Guardando producto:",
          id,
          productData
        );


        await setDoc(

          doc(
            db,
            "productos",
            id
          ),

          productData,

          {
            merge: true
          }

        );


        console.log(
          "✅ Producto guardado correctamente."
        );


        alert(
          "✅ Producto guardado correctamente."
        );


        document
          .getElementById(
            "admin-modal"
          )
          .style.display =
            "none";


        document
          .getElementById(
            "product-form"
          )
          .reset();


        document
          .getElementById(
            "prod-id"
          )
          .value =
            "";


      } catch (
        err
      ) {

        console.error(
          "❌ ERROR GUARDANDO PRODUCTO:",
          err
        );


        alert(

          "❌ Error al guardar producto.\n\n" +

          "Código: " +
          (err.code || "desconocido") +

          "\n\n" +

          err.message

        );


      } finally {

        submitBtn.disabled =
          false;


        submitBtn.textContent =
          "Guardar Producto";

      }

    }
  );



/* =========================
   EDITAR PRODUCTO
========================= */

function editProduct(id) {

  const prod =
    products.find(
      p =>
        p.id === id
    );


  if (
    !prod
  ) {

    return alert(
      "No se encontró el producto."
    );

  }


  document
    .getElementById(
      "prod-id"
    )
    .value =
      prod.id;


  document
    .getElementById(
      "prod-name"
    )
    .value =
      prod.name ||
      "";


  document
    .getElementById(
      "prod-price"
    )
    .value =
      prod.price ||
      "";


  document
    .getElementById(
      "prod-image"
    )
    .value =
      prod.image ||
      "";


  document
    .getElementById(
      "prod-image-file"
    )
    .value =
      "";


  document
    .getElementById(
      "admin-modal"
    )
    .style.display =
      "flex";

}

========================= */

async function deleteProduct(id) {

  if (
    !confirm(
      "¿Eliminar este producto?"
    )
  ) {

    return;

  }


  try {

    await deleteDoc(

      doc(
        db,
        "productos",
        id
      )

    );


    console.log(
      "🗑️ Producto eliminado:",
      id
    );


  } catch (
    error
  ) {

    console.error(
      "❌ Error eliminando:",
      error
    );


    alert(

      "❌ Error al eliminar:\n" +

      error.message

    );

  }

}
